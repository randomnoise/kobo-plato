selected-library = 0
keyboard-layout = "English"
frontlight = true
wifi = false
inverted = false
sleep-cover = true
auto-share = false
button-scheme = "natural"
auto-suspend = 15.0
auto-power-off = 0.125
time-format = "%H:%M"
date-format = "%A, %F"
external-urls-queue = "bin/article_fetcher/urls.txt"

[[libraries]]
name = "Example"
# should be pwd for path, obscured here:
path = "..."
mode = "database"
sort-method = "opened"
first-column = "title-and-author"
second-column = "progress"
thumbnail-previews = true

[intermissions]
suspend = "logo:"
power-off = "logo:"
share = "logo:"

[[frontlight-presets]]
timestamp = 120

[frontlight-presets.frontlightLevels]
intensity = 2.0
warmth = 0.0

