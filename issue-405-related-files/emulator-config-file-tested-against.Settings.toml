[home]
address-bar = false
navigation-bar = true
max-levels = 3
max-trash-size = 33554432

[reader]
finished = "close"
south-east-corner = "go-to-page"
bottom-right-gesture = "toggle-inverted"
south-strip = "toggle-bars"
west-strip = "previous-page"
east-strip = "next-page"
strip-width = 0.6000000238418579
corner-width = 0.4000000059604645
font-path = "/mnt/onboard/fonts"
font-family = "Libertinus Serif"
font-size = 11.5
min-font-size = 5.5
max-font-size = 16.5
text-align = "left"
margin-width = 2
min-margin-width = 0
max-margin-width = 10
line-height = 1.2000000476837158
continuous-fit-to-width = true
ignore-document-css = false
dithered-kinds = ["cbz", "jpeg", "jpg", "png"]

[reader.paragraph-breaker]
hyphen-penalty = 50
stretch-tolerance = 1.2599999904632568

[reader.refresh-rate]
regular = 8
inverted = 2

[import]
unshare-trigger = true
startup-trigger = true
sync-metadata = true
metadata-kinds = ["djvu", "epub", "pdf"]
allowed-kinds = ["djvu", "mobi", "fb2", "txt", "cbz", "xps", "oxps", "pdf", "epub"]

[dictionary]
margin-width = 4
font-size = 11.0

[sketch]
save-path = "Sketches"
notify-success = true

[sketch.pen]
size = 2
dynamic = true
amplitude = 4.0
min-speed = 0.0
max-speed = 2120.0

[sketch.pen.color]
gray = 0

[calculator]
font-size = 8.0
margin-width = 2
history-size = 4096

[battery]
warn = 10.0
power-off = 3.0

[frontlight-levels]
intensity = 0.0
warmth = 0.0
