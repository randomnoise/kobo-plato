name: diffoscope CI

on: push

jobs:
  plato-build:
    runs-on: ubuntu-latest
    steps:
    - name: diffoscope
      run: |
        set -eux -o pipefail
        # dpkg-query --show diffoscope
        # > dpkg-query: no packages found matching diffoscope
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends diffoscope
        dpkg-query --show diffoscope
